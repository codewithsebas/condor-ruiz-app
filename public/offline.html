<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dcc39c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f160e" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión · Cabañas El Cóndor del Ruiz</title>
    <!-- Página autocontenida (sin CSS, fuentes ni JS externos): el service worker la muestra cuando no hay internet.
         Paleta «Madera clara» del sitio (lib/theme.ts) y el sello del Cóndor: el símbolo de public/marca/simbolo.png,
         reducido e incrustado como máscara para que no dependa de la red. -->
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #dcc39c;
        --ink: #3a2817;
        --ink-muted: color-mix(in srgb, #3a2817 72%, #dcc39c);
        --card: #fbf6ec;
        --card-deep: #efe2c9;
        --on-card: #3a2817;
        --seal: #5b3a21;
        --seal-mark: #fbf6ec;
        --error: #b33a26;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #1f160e;
          --ink: #f4ead8;
          --ink-muted: #c4b49c;
          --card: #3b2a1c;
          --card-deep: #4a3525;
          --on-card: #f4ead8;
          --seal: #dcc39c;
          --seal-mark: #3a2817;
          --error: #f08a7d;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        background: var(--canvas); color: var(--ink);
        font: 15px/1.5 Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        position: relative; isolation: isolate; overflow: hidden;
        display: flex; flex-direction: column; align-items: flex-start; gap: 16px;
        width: 100%; max-width: 420px; padding: 28px; border-radius: 28px; background: var(--card); color: var(--on-card);
        box-shadow: 0 22px 44px -20px rgb(58 40 23 / 0.45);
      }
      .deco { position: absolute; z-index: -1; top: -26px; right: -26px; width: 130px; height: 130px; fill: var(--card-deep); transform: rotate(12deg); }
      .seal { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--seal); }
      .seal i {
        display: block; width: 80%; aspect-ratio: 800 / 338; background: var(--seal-mark);
        -webkit-mask: var(--simbolo) center / contain no-repeat; mask: var(--simbolo) center / contain no-repeat;
      }
      .status {
        display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
        background: color-mix(in srgb, var(--on-card) 10%, transparent); font-size: 12.5px; font-weight: 600;
      }
      .dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--error); }
      .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--error); animation: ping 1.6s ease-out infinite; }
      @keyframes ping { 75%, 100% { transform: scale(2.4); opacity: 0; } }
      h1 { margin: 4px 0 0; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.03em; }
      p { margin: 0; color: color-mix(in srgb, var(--on-card) 80%, var(--card)); }
      button {
        display: inline-flex; align-items: center; gap: 8px; height: 44px; margin-top: 4px; padding: 0 22px;
        border: 0; border-radius: 999px; background: var(--seal); color: var(--seal-mark);
        font: inherit; font-weight: 600; cursor: pointer; transition: transform .15s, opacity .15s;
      }
      button:hover { opacity: .88; }
      button:active { transform: scale(.97); }
      button:focus-visible { outline: 3px solid var(--on-card); outline-offset: 3px; }
      button svg { width: 16px; height: 16px; }
      small { color: var(--ink-muted); font-size: 12.5px; }
      @media (prefers-reduced-motion: reduce) { .dot::after { animation: none; } button { transition: none; } }
    </style>
