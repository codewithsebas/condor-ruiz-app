<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#163A2A" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión · Cabañas El Cóndor del Ruiz</title>
    <!-- Página autocontenida (sin CSS ni JS externos): el service worker la muestra cuando no hay internet. -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        background: #163a2a; color: #f2ebd3;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 26rem; }
      .mark { display: grid; place-items: center; width: 84px; height: 84px; border: 2px solid #f2ebd3; border-radius: 50%; }
      h1 { margin: 6px 0 0; font-size: 2rem; line-height: 1.05; letter-spacing: .02em; text-transform: uppercase; font-weight: 800; }
      p { margin: 0; color: color-mix(in srgb, #f2ebd3 85%, #163a2a); }
      button {
        margin-top: 6px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px;
        background: #f2ebd3; color: #163a2a; font: inherit; font-weight: 800; cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #d9a441; outline-offset: 3px; }
      small { color: color-mix(in srgb, #f2ebd3 70%, #163a2a); font-size: .85rem; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">
        <svg width="56" height="56" viewBox="0 0 48 48">
          <path d="M8 36 L19 20 L24 26 L29 18 L40 36 Z" fill="#f2ebd3" />
          <path d="M19 20 L22.5 25 L20.5 25 L19 23.5 L17.2 26 Z M29 18 L33.5 24.5 L31 24 L29 22.5 L26.8 25.5 L26 24.5 Z" fill="#163a2a" />
          <path d="M24 12.5 C21.5 11 18 10.2 13 11.2 L15 12 L13 13 L16 13 L15 14.4 C18 13.4 21 13.4 23 14.4 L24 16.2 L25 14.4 C27 13.4 30 13.4 33 14.4 L32 13 L35 13 L33 12 L35 11.2 C30 10.2 26.5 11 24 12.5 Z" fill="#f2ebd3" />
        </svg>
      </span>
      <h1>Sin conexión</h1>
      <p>No hay internet en este momento. Revisa tu conexión: la página se abrirá sola apenas vuelva la señal.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
      <small>Cabañas El Cóndor del Ruiz · Murillo, Tolima</small>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
